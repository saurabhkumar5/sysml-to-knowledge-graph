# SysON = web-based SysML v2 modeling tool + model repository + SysML v2 REST API
# Based on the official SysON docker-compose.yml (github.com/eclipse-syson/syson)
# Start : docker compose up -d
# Open  : http://localhost:8080            (SysON web app)
#         http://localhost:8080/swagger-ui/index.html   (REST API docs)
# Stop  : docker compose stop              (keeps the data)
services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - syson-db:/var/lib/postgresql/data   # keeps the models after a restart
    networks:
      - syson
  app:
    image: "${IMAGE_TAG:-eclipsesyson/syson:v2026.11.0}"
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      - database
    networks:
      - syson
networks:
  syson:
volumes:
  syson-db:
